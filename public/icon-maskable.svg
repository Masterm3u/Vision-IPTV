<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0A1826"/>
      <stop offset="100%" stop-color="#03060A"/>
    </linearGradient>
    <linearGradient id="primaryGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGradMask" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Content scaled inside the 80% safe zone (center at 256, 256, radius ~190) -->
  <g transform="translate(40, 40) scale(0.84)">
    <!-- Ambient Glow -->
    <circle cx="256" cy="235" r="130" fill="#10B981" opacity="0.18" filter="url(#glowMask)"/>

    <!-- TV Display Screen Contour -->
    <rect x="92" y="105" width="328" height="236" rx="36" fill="#0D1520" stroke="#1E293B" stroke-width="5"/>
    <rect x="94" y="107" width="324" height="232" rx="34" fill="#FFFFFF" fill-opacity="0.04"/>

    <!-- Wings of V Crest -->
    <path d="M 148 160 L 210 160 L 256 290 L 222 290 Z" fill="url(#accentGradMask)"/>
    <path d="M 364 160 L 302 160 L 256 290 L 290 290 Z" fill="url(#primaryGradMask)"/>

    <!-- Play Arrow -->
    <polygon points="236,196 236,266 296,231" fill="#FFFFFF" filter="url(#glowMask)"/>
    <polygon points="238,202 238,260 290,231" fill="url(#primaryGradMask)"/>

    <!-- Broadcast Waves -->
    <path d="M 226 78 C 246 66 266 66 286 78" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <path d="M 206 58 C 238 40 274 40 306 58" fill="none" stroke="#34D399" stroke-width="7" stroke-linecap="round" opacity="0.5"/>

    <!-- TV Base -->
    <path d="M 232 343 L 280 343 L 290 371 L 222 371 Z" fill="#1E293B"/>
    <rect x="186" y="371" width="140" height="10" rx="5" fill="url(#primaryGradMask)"/>

    <!-- Brand Typography -->
    <text x="256" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">VISION</text>
    <text x="256" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="middle" letter-spacing="10">IPTV</text>
  </g>
</svg>
